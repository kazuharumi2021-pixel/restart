<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b7fc7"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="stylesheet" href="styles.css"><title>RE:START</title></head><body><header><b>RE:START</b><span id="today"></span></header><main id="app"></main><nav><button data-tab="home">⌂<small>ホーム</small></button><button data-tab="calendar">▦<small>カレンダー</small></button><button data-tab="record">✓<small>記録</small></button><button data-tab="report">▥<small>レポート</small></button><button data-tab="settings">⚙<small>設定</small></button></nav><dialog id="taskDlg"><form method="dialog"><h3>タスク追加</h3><label>名前<input id="taskName" required></label><label>区分<select id="taskType"><option>MUST</option><option>SHOULD</option><option>BONUS</option></select></label><label>点数<input id="taskPoints" type="number" min="0" max="30" value="5"></label><menu><button value="cancel">取消</button><button id="taskSave" value="default">保存</button></menu></form></dialog><dialog id="skipDlg"><form method="dialog"><h3>今日はできない</h3><p class="muted">持ち越さず、理由を記録します。</p><select id="skipReason"><option>残業</option><option>飲み会</option><option>家族予定</option><option>出張・旅行</option><option>体調不良</option><option>疲労</option><option>スマホ・ゲーム</option><option>なんとなく</option><option>その他</option></select><menu><button value="cancel">取消</button><button id="skipSave" value="default">記録</button></menu></form></dialog><script src="app.js"></script></body></html>
