<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="stylesheet" href="styles.css"><title>RE:START</title></head><body><header><b>RE:START</b><span id="date"></span></header><main><section class="hero"><div><small>DAY 1 / LIFE SCORE</small><strong id="score">0</strong></div><button id="minimum">今日は最低限</button></section><section><h2>今日のルーティン</h2><div id="tasks"></div><button id="addTask">＋ タスク追加</button></section><section><h2>QUICK</h2><div class="grid"><button data-view="body">🏃 BODY</button><button data-view="study">📚 STUDY</button><button data-view="money">💴 MONEY</button><button data-view="calendar">📅 CALENDAR</button></div></section><section id="panel"><h2>Day 1</h2><p>2026/11/3（火・祝）から開始。まずは生活リズムを整える2週間です。</p><p class="note">※ 薬の用量変更や飲み忘れ時の判断はアプリでは行いません。処方どおりに服用してください。</p></section></main><dialog id="taskDialog"><form method="dialog"><h3>タスク追加</h3><input id="taskName" placeholder="タスク名"><select id="taskType"><option>MUST</option><option>SHOULD</option><option>BONUS</option></select><menu><button value="cancel">キャンセル</button><button id="saveTask" value="default">追加</button></menu></form></dialog><script src="app.js"></script></body></html>
